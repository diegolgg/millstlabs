[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "millstlabs"
version = "0.1.0"
description = "Independent recurrent agents, ecological selection, and adult-policy inheritance"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "gymnasium>=1.0,<2", "pettingzoo>=1.24,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=4.48,<5", "peft>=0.14,<1"]
flags = ["httpx>=0.28,<1", "Pillow>=11,<13"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.9,<4", "nbclient>=0.10,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
millst = "millstlabs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
