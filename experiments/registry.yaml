# Source of truth for the lab. Machine-facing. Enrico reads IDEAS.md / RESULTS.md / findings/ instead.
# Every agreed idea has one entry. `python -m culture.lab check` validates this file against IDEAS.md, findings/,
# notes/ and configs/ (every referenced path exists; every label in IDEAS.md's table is here; statuses agree).

budget:
  weekly_usd: 0.0            # Enrico sets this. 0 means stub and local only.
  spent_this_week_usd: 0.0   # updated by the runner from the spend guard
  week_starting: 2026-10-06

diego:
  main_hash_summarized: null # set by the subagent that builds docs/DIEGO.md; sessions compare with `git rev-parse main`

labels: {}                   # label -> entry, filled when Enrico agrees an idea
