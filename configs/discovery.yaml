# Four-arm LLM corpus proof of concept; arms are generated by millstlabs.discovery.
environment:
  founders: 8
  population_cap: 16
  social_denominator: 16
  predator_temperature: 1.0
training:
  backend: smollm
  device: cpu
  cpu_threads: 4
  decisions: 32768
  warmstart_transitions: 8192
  rollout_ticks: 32
  social_window: 256
  sequence_length: 32
  separate_critic: true
  value_scale: 100.0
  controller_lr: 0.0003
  critic_lr: 0.001
  checkpoints:
  - 0
  - 16384
  - 32768
  evaluation_maps: 4
  final_evaluation_maps: 4
  evaluation_horizon: 512
  evaluation_policies: 8
  evaluation_seed: 6000000
  development_maps: 2
  development_seed: 5000000
  temperature_start: 1.0
  temperature_end: 1.0
  evaluation_temperature: 1.0
  predator_evaluation_temperatures: []
  newborn_evaluation_every: 0
  newborn_evaluation_maps: 1
  newborn_evaluation_horizon: 128
  controller_architecture: split
  corpus_mode: private
  corpus_slots: 4
  corpus_food_ttl: 16
  corpus_tool_cost: 0.05
  intrinsic_critic: true
profiles:
  prosocial:
    social_preference: 0.5
    vigilance_bias: 0.0
methods:
- r_adult
seeds:
- 11
