# C2 pilot on the local MLX server (Overnight 2, step 4; files/prereg/C2-quarantine.md section 4): the
# verified_quarantine stratum on the C1 pilot's 5 seeds, exhaustive delivery, compared against C1's verified stratum
# (runs/c1-full) on the same seeds. Identical to configs/c1_full_mlx.yaml except the stratum and the name; the name
# differs on purpose, so no C1 cache entry is reused and every distinct prompt is sent to the server afresh (under
# quarantine the 8 subsets collapse to 2 distinct prompts per seed, nothing delivered or Piers only; the other 6 are
# within-run cache hits for byte-identical requests). Zero cost.
name: c2_pilot_mlx
k: 3
teachers: [piers, flawed_persuasive, self]
delivery: exhaustive
replicates: [0, 1, 2, 3, 4]
generation: 1
ridge_lam: 1.0
ridge_runs: 8
base:
  experiment_seed: 100
  evaluation: {selfplay_games: 300, crossplay_games: 0, anchor_games: 0, between_group_games: 0, ladder_every: 0, workers: 8}
  llm: {backend: openai_compat, model: mlx-community/Qwen3.6-35B-A3B-4bit, base_url: "http://127.0.0.1:8080/v1",
        temperature: 0.0, max_tokens: 8192, request_timeout_s: 1200}
strata: [verified_quarantine]
