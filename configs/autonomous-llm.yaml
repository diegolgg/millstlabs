# Direct LLM actions and tentative tactics, with zero task demonstrations.
environment:
  founders: 8
  population_cap: 16
  social_denominator: 16
  predator_temperature: 1.0
training:
  backend: smollm
  action_policy: lm_token
  controller_architecture: split
  actor_grounding: false
  device: cpu
  cpu_threads: 1
  max_tokens: 1024
  decisions: 8192
  warmstart_transitions: 0
  feed_retention: 0.0
  rollout_ticks: 16
  social_window: 256
  sequence_length: 4
  epochs: 2
  adapter_lr: 0.00003
  entropy: 0.01
  separate_critic: true
  value_scale: 100.0
  critic_lr: 0.001
  mutation_rms: 0.0
  mutation_watch_std: 0.0
  corpus_interface: notes
  note_memory: tactics
  note_style: prose
  corpus_mode: shared
  corpus_slots: 4
  corpus_tool_cost: 0.0
  note_interval: 32
  note_max_tokens: 48
  note_credit: 0.1
  note_write_penalty: 0.0
  checkpoints: [0, 2048, 8192]
  evaluation_maps: 2
  final_evaluation_maps: 4
  evaluation_horizon: 256
  evaluation_seed: 7000000
  development_maps: 0
  newborn_evaluation_every: 0
profiles:
  prosocial:
    social_preference: 0.5
    vigilance_bias: 0.0
methods: [r_adult]
seeds: [11]
