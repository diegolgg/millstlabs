# Queue item 1 (spec section 16): transfer with verification vs solo at matched budget.
# Two agents in one group; the student is the agent with the lower generation-0 score (identical across conditions,
# because warm starts are paired). best_to_all: the better agent sends its artifact to the worse one.
base:
  name: stage1_transfer
  experiment_seed: 11
  population: {groups: 1, agents_per_group: 2}
  evaluation: {selfplay_games: 100, crossplay_games: 50, anchor_games: 50, between_group_games: 0, ladder_every: 0, workers: 0}
  corpus: {enabled: false}
  runner: {generations: 11}   # generation 0 is the warm start, then 10 generations
  thresholds: {student_score_delta: 1.0}
conditions:
  solo: {org: {routing: none, verification: none}}
  transfer_unverified: {org: {routing: best_to_all, verification: none}}
  transfer_verified: {org: {routing: best_to_all, verification: {name: selfplay, n: 100}}}
population_seeds: [0, 1, 2]
