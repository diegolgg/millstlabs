# CPU engineering pilot, not the confirmatory 60-run experiment.
# Three methods, four profiles, one shared seed. Run serially.
environment:
  reproduction_mode: gestation  # Preserve this frozen pilot and its checkpoints.
  founders: 8
  population_cap: 16
  social_denominator: 16
training:
  backend: smollm
  device: cpu
  cpu_threads: 4
  decisions: 16384
  warmstart_transitions: 4096
  rollout_ticks: 128
  social_window: 256
  sequence_length: 32
  epochs: 2
  checkpoints: [0, 8192, 16384]
  evaluation_maps: 2
  final_evaluation_maps: 4
  evaluation_horizon: 512
  evaluation_policies: 8
  # Distinct from the main study's 1,000,000-series evaluation maps.
  evaluation_seed: 2000000
  newborn_evaluation_every: 8
  newborn_evaluation_maps: 1
  newborn_evaluation_horizon: 128
profiles:
  individual: {social_preference: 0.0, vigilance_bias: 0.0}
  prosocial: {social_preference: 0.5, vigilance_bias: 0.0}
  competitive: {social_preference: -0.5, vigilance_bias: 0.0}
  vigilance: {social_preference: 0.0, vigilance_bias: 1.0}
seeds: [11]
methods: [r_adult, r_initial, iteration]
