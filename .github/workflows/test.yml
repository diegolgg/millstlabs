name: Sandbox checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[train,api,dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: bash scripts/smoke.sh runs/ci-smoke
